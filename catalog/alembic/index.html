<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>#alembic { --ink: #000; --paper: #fff; --rule: 3px; --display: Georgia, "Times New Roman", serif; --body: Verdana, Arial, sans-serif; font: 400 18px/1.4 Verdana, Arial, sans-serif; color: #000; background: #fff; padding: 4px 0 8px; -webkit-text-size-adjust: 100%; }
#alembic *, #alembic *::before, #alembic *::after { box-sizing: border-box; transition: none !important; animation: none !important; }
#alembic p, #alembic h1, #alembic h2, #alembic ul, #alembic ol { margin: 0; }
#alembic .wrap > * { min-width: 0; margin-bottom: 16px; }
#alembic .mast { border-bottom: 3px solid #000; padding-bottom: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: end; }
#alembic .mast p { margin: 4px 0 0; font-size: 16px; }
#alembic .count { font-weight: 700; font-size: 16px; text-align: right; }
#alembic .label { font: 700 16px/1.2 Verdana, Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
#alembic .note { font-size: 16px; }
#alembic .goal { border: 6px double #000; padding: 12px 14px; }
#alembic .goal > * { margin-bottom: 8px; }
#alembic .goal > *:last-child { margin-bottom: 0; }
#alembic .goal-name { font: 700 30px/1.1 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
#alembic .goal-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
#alembic .hint-text { font-weight: 700; }
#alembic .btn { font: 700 18px/1 Verdana, Arial, sans-serif; min-height: 56px; padding: 0 18px; background: #fff; color: #000; border: 3px solid #000; border-radius: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#alembic .btn:active, #alembic .btn[aria-pressed="true"] { background: #000; color: #fff; }
#alembic .btn[disabled] { border-style: dashed; cursor: default; background: #fff; color: #000; }
#alembic .btn.small { min-height: 48px; font-size: 16px; padding: 0 14px; }
#alembic :focus { outline: 4px solid #000; outline-offset: 3px; }
#alembic .bench { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px; row-gap: 10px; align-items: stretch; }
#alembic .slot { position: relative; min-width: 0; min-height: 80px; padding: 26px 10px 8px; display: block; text-align: left; background: #fff; color: #000; border: 3px dashed #000; border-radius: 0; font-family: Verdana, Arial, sans-serif; cursor: pointer; touch-action: manipulation; }
#alembic .slot.filled { border-style: solid; }
#alembic .slot .tag { position: absolute; top: 7px; left: 10px; font: 700 16px/1 Verdana, Arial, sans-serif; letter-spacing: 0.1em; }
#alembic .slot .nm { display: block; font: 700 20px/1.1 Verdana, Arial, sans-serif; overflow-wrap: anywhere; }
#alembic .slot .empty { display: block; font-size: 16px; }
#alembic .slot .x { position: absolute; top: 7px; right: 8px; font: 700 16px/1 Verdana, Arial, sans-serif; }
#alembic .result { grid-column: 1 / -1; border: 3px solid #000; padding: 12px 14px; }
#alembic .result > * { margin-bottom: 10px; }
#alembic .result > *:last-child { margin-bottom: 0; }
#alembic .result .out { margin-top: 6px; font: 700 28px/1.1 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
#alembic .result .eq { overflow-wrap: anywhere; }
#alembic .chip { display: inline-block; margin: 0 6px 4px 0; background: #000; color: #fff; border: 2px solid #000; padding: 3px 8px; font: 700 16px/1.2 Verdana, Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
#alembic .chip.plain { background: #fff; color: #000; }
#alembic .uses { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); column-gap: 8px; row-gap: 8px; }
#alembic .uses .btn { overflow-wrap: anywhere; line-height: 1.1; padding-top: 8px; padding-bottom: 8px; }
#alembic .tabs { display: grid; grid-template-columns: repeat(4, 1fr); border: 3px solid #000; }
#alembic .tab { min-height: 52px; border: 0; border-right: 3px solid #000; border-radius: 0; background: #fff; color: #000; font: 700 17px/1 Verdana, Arial, sans-serif; cursor: pointer; touch-action: manipulation; padding: 0 4px; }
#alembic .tab:last-child { border-right: 0; }
#alembic .tab[aria-selected="true"] { background: #000; color: #fff; }
#alembic .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; margin-bottom: 12px; }
#alembic .find { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; margin-bottom: 12px; }
#alembic .input { font: 400 18px/1 Verdana, Arial, sans-serif; min-height: 48px; min-width: 0; width: 100%; padding: 0 12px; border: 3px solid #000; border-radius: 0; background: #fff; color: #000; }
#alembic .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); column-gap: 6px; row-gap: 6px; margin-bottom: 12px; }
#alembic .letters .btn { min-height: 48px; padding: 0; font-size: 17px; }
#alembic .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 10px; row-gap: 10px; }
@media (min-width: 560px) { #alembic .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
#alembic .tile { position: relative; min-width: 0; min-height: 82px; padding: 8px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; text-align: left; background: #fff; color: #000; border: 3px solid #000; border-radius: 0; font-family: Verdana, Arial, sans-serif; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#alembic .tile[aria-pressed="true"] { background: #000; color: #fff; }
#alembic .tile .top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
#alembic .tile .gl { display: block; height: 28px; font: 700 16px/28px Georgia, "Times New Roman", serif; letter-spacing: 0.06em; }
#alembic .tile .gl svg { width: 26px; height: 26px; display: block; margin-top: 1px; }
#alembic .tile .nm { display: block; max-width: 100%; font: 700 17px/1.1 Verdana, Arial, sans-serif; overflow-wrap: anywhere; }
#alembic .tile .new { display: block; border: 2px solid currentColor; padding: 0 4px; font: 700 16px/1.2 Verdana, Arial, sans-serif; }
#alembic .pager { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 10px; align-items: center; margin-top: 14px; }
#alembic .pager .pg { font-weight: 700; font-size: 16px; text-align: center; }
#alembic .pager .btn { min-width: 104px; }
#alembic .journal { list-style: none; padding: 0; border-top: 3px solid #000; }
#alembic .journal li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 2px; align-items: baseline; padding: 11px 0; border-bottom: 2px solid #000; }
#alembic .journal .r { font: 700 20px/1.2 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
#alembic .journal .t { font: 700 16px/1 Verdana, Arial, sans-serif; letter-spacing: 0.06em; text-align: right; }
#alembic .journal .i { grid-column: 1 / -1; font-size: 16px; overflow-wrap: anywhere; }
#alembic .sets { list-style: none; padding: 0; border-top: 3px solid #000; }
#alembic .sets li { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 12px 0; border-bottom: 2px solid #000; }
#alembic .sets .nm { font: 700 22px/1.15 Georgia, "Times New Roman", serif; overflow-wrap: anywhere; }
#alembic .sets .note { overflow-wrap: anywhere; }
#alembic .sets .btn { min-width: 112px; }
#alembic .help h2 { margin-bottom: 8px; font: 700 22px/1.2 Georgia, "Times New Roman", serif; }
#alembic .help p, #alembic .help li { margin-bottom: 10px; }
#alembic .help ul { margin-bottom: 14px; padding-left: 22px; }
#alembic .status { font-size: 16px; }
#alembic .gap { margin-top: 18px; }</style>
</head>

<div id="alembic">

      <div>
        <p class="label">Alembic</p>

    <div class="tabs" id="am-tabs" role="tablist" aria-label="Sections"></div>
    <section id="am-view"></section>
    <p class="status" id="am-status"></p>
  </div>
</div>

h("div", { class: "bar" }, h("p", { class: "label", text: "Choose a set" }), h("p", { class: "note", text: "Each set saves its own progress." })),
h("ul", { class: "sets" }, KEYS.map(function (k) {
var d = defs[k];
var isCur = k === setKey;
var note = d.src > d.c ? " Source lists " + d.src + "; " + d.c + " can be made." : "";
return h("li", {},
h("div", {},
h("p", { class: "nm", text: d.t }),
h("p", { class: "note", text: d.id }),
h("p", { class: "note", text: foundCountFor(k) + " of " + d.c + " found." + note })),
h("button", { class: "btn", type: "button", "data-key": "set:" + k, disabled: isCur, onclick: function () { switchSet(k); }, text: isCur ? "Playing" : "Play" }));
})));
}
function renderHelp() {
fill($("am-view"), h("div", { class: "help" },
h("h2", { text: "How to play" }),
h("ul", {},
h("li", { text: "Tap an element to put it on the bench, then tap another. They combine as soon as they match a recipe." }),
h("li", { text: "Tap a filled slot to take that element back off." }),
h("li", { text: "The same element twice is allowed. Some recipes need three or more, so the bench keeps waiting when a longer recipe could still match." }),
h("li", { text: "Some recipes make several elements at once. Use buttons put a result straight back on the bench." }),
h("li", { text: "Filter by name or jump by first letter to find an element in a large set." }),
h("li", { text: "Roman numerals mark an element's tier: how many steps it sits from the starting elements." }),
h("li", { text: "Sets come from the alchemy-lab recipe files. Starting elements are Water, Fire, Earth and Air, plus any element a set never produces." })),
h("div", { class: "gap" },
h("p", { class: "label", text: "Erase this set" }),
h("p", { class: "note", text: "Erases progress in " + cur.title + " only. Other sets are not touched." }),
h("div", { class: "gap" }, h("button", { class: "btn", type: "button", "data-key": "reset", onclick: resetSet, text: armed ? "Tap again to erase " + cur.title : "Start " + cur.title + " over" })))));
}
function renderStatus() {
$("am-status").textContent = "Progress is saved in this app, one record per set.";
}
function render(focus) {
renderTop();
renderGoal();
renderBench();
renderTabs();
if (tab === "journal") renderJournal();
else if (tab === "sets") renderSets();
else if (tab === "help") renderHelp();
else renderPlay();
renderStatus();
focusKey(focus);
}
function start() {
if (window.KodyBridge && typeof window.KodyBridge.create === "function") {
var fieldTypes = { cur: "string", sort: "string", hints: "string" };
KEYS.forEach(function (k) { fieldTypes["p_" + k] = "string"; });
store = window.KodyBridge.create(section, { fieldTypes: fieldTypes });
applyDurable(store.getState().desired, true);
enterSet(setKey);
store.subscribe(function (snap) { applyDurable(snap.desired, false); refreshHave(); render(); });
store.startSpanObserver();
} else {
applyDurable(readSeed(), true);
enterSet(setKey);
}
render();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();
})();
</script>
</body>
</html>
