<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
.calc-wrap { background-color: #fff; background-image: radial-gradient(#000 1px, transparent 1.4px); background-size: 4px 4px; text-align: center; padding: 16px; max-width: 320px; margin: 0 auto; }
.calc-wrap .os-display { margin: 0 0 16px 0; }




</style>
</head>
<body>
<div class="calc-wrap">
<p class="os-display" id="calc-display">0</p>
<div class="os-keypad" id="calc-keys"></div>
</div>
<script>
(function () {
  var displayEl = document.getElementById('calc-display');
  var keysEl = document.getElementById('calc-keys');
  var entry = '0';
  var accumulator = null;
  var pending = null;
  var waiting = false;
  var error = false;

  function formatResult(value) {
    if (!isFinite(value)) { return 'Error'; }
    var rounded = Math.round(value * 10000000000) / 10000000000;
    var text = String(rounded);
    if (text.length > 12) {
      if (Math.abs(rounded) >= 1000000000000 || (Math.abs(rounded) < 0.000001 && rounded !== 0)) {
        text = rounded.toExponential(5);
      } else {
        text = text.slice(0, 12);
      }
    }
    return text;
  }

  function show() {
    displayEl.textContent = entry;
  }

  function compute(a, op, b) {
    if (op === '+') { return a + b; }
    if (op === '-') { return a - b; }
    if (op === '*') { return a * b; }
    if (op === '/') { return b === 0 ? NaN : a / b; }
    return b;
  }

  function clearAll() {
    entry = '0';
    accumulator = null;
    pending = null;
    waiting = false;
    error = false;
    show();
  }

  function clearEntry() {
    if (error) { clearAll(); return; }
    entry = '0';
    waiting = false;
    show();
  }

  function pressDigit(digit) {
    if (error) { clearAll(); }
    if (waiting) {
      entry = digit;
      waiting = false;
    } else {
      if (entry === '0') { entry = digit; }
      else if (entry.replace(/[^0-9]/g, '').length < 12) { entry += digit; }
    }
    show();
  }

  function pressDecimal() {
    if (error) { clearAll(); }
    if (waiting) {
      entry = '0.';
      waiting = false;
    } else if (entry.indexOf('.') < 0) {
      entry += '.';
    }
    show();
  }

  function pressOperator(op) {
    if (error) { return; }
    var value = parseFloat(entry);
    if (pending !== null && !waiting) {
      var result = compute(accumulator, pending, value);
      entry = formatResult(result);
      if (entry === 'Error') { error = true; accumulator = null; pending = null; waiting = false; show(); return; }
      accumulator = parseFloat(entry);
    } else {
      accumulator = value;
    }
    pending = op;
    waiting = true;
    show();
  }

  function pressEquals() {
    if (error || pending === null) { return; }
    var value = parseFloat(entry);
    var result = compute(accumulator, pending, value);
    entry = formatResult(result);
    if (entry === 'Error') { error = true; }
    accumulator = null;
    pending = null;
    waiting = true;
    show();
  }

  function pressKey(key) {
    if (key >= '0' && key <= '9') { pressDigit(key); }
    else if (key === '.') { pressDecimal(); }
    else if (key === '+') { pressOperator('+'); }
    else if (key === '-') { pressOperator('-'); }
    else if (key === '*') { pressOperator('*'); }
    else if (key === '/') { pressOperator('/'); }
    else if (key === '=') { pressEquals(); }
    else if (key === 'C') { clearAll(); }
    else if (key === 'E') { clearEntry(); }
  }

  var keys = [
    { label: 'C', key: 'C' },
    { label: 'E', key: 'E' },
    { label: '=', key: '=' },
    { label: '*', key: '*' },
    { label: '7', key: '7' },
    { label: '8', key: '8' },
    { label: '9', key: '9' },
    { label: '/', key: '/' },
    { label: '4', key: '4' },
    { label: '5', key: '5' },
    { label: '6', key: '6' },
    { label: '-', key: '-' },
    { label: '1', key: '1' },
    { label: '2', key: '2' },
    { label: '3', key: '3' },
    { label: '+', key: '+', tall: true },
    { label: '0', key: '0', wide: true },
    { label: '.', key: '.' }
  ];

  function init() {
    for (var i = 0; i < keys.length; i++) {
      (function (def) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'os-key' + (def.wide ? ' os-key--wide' : '') + (def.tall ? ' os-key--tall' : '');
        btn.textContent = def.label;
        btn.addEventListener('click', function () { pressKey(def.key); });
        keysEl.appendChild(btn);
      })(keys[i]);
    }
    document.addEventListener('keydown', function (e) {
      var k = e.key;
      if ((k >= '0' && k <= '9') || k === '.' || k === '+' || k === '-' || k === '*' || k === '/') {
        pressKey(k);
      } else if (k === 'Enter' || k === '=') {
        e.preventDefault();
        pressEquals();
      } else if (k === 'Escape') {
        clearEntry();
      } else if (k === 'c' || k === 'C') {
        clearAll();
      } else if (k === 'e' || k === 'E') {
        clearEntry();
      }
    });
    show();
  }

  if (document.readyState !== 'loading') {
    init();
  } else {
    document.addEventListener('DOMContentLoaded', init);
  }
})();
</script>
</body>
</html>
