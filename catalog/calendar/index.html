<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
.cal-wrap { padding: 16px; }
.cal-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 0 0 16px 0; }
.cal-bar button { display: flex; align-items: center; justify-content: center; }
.cal-title { font-size: 24px; line-height: 1.2; margin: 0; text-align: center; }

.cal-prev { justify-self: start; }
.cal-next { justify-self: end; }
.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-gap: 4px; }
.cal-weekdays { margin: 0 0 8px 0; font-weight: bold; text-align: center; }
.cal-cell { min-height: 48px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.cal-today { background: #111; color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div class="cal-wrap">
<div class="cal-bar"><button class="cal-prev" type="button" aria-label="Previous" title="Previous"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg></button><h2 class="cal-title"></h2><button class="cal-next" type="button" aria-label="Next" title="Next"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg></button></div>
<div class="cal-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
<div class="cal-grid"></div>
</div>
<script>
var CAL_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function calDaysInMonth(year, month) { return new Date(year, month + 1, 0).getDate(); }
function calRender(root, year, month) {
  var title = root.querySelector('.cal-title');
  var grid = root.querySelector('.cal-grid');
  if (!title || !grid) { return; }
  title.textContent = CAL_MONTHS[month] + ' ' + String(year);
  var now = new Date();
  var todayYear = now.getFullYear();
  var todayMonth = now.getMonth();
  var todayDay = now.getDate();
  var firstWeekday = new Date(year, month, 1).getDay();
  var days = calDaysInMonth(year, month);
  var html = '';
  var i;
  for (i = 0; i < firstWeekday; i++) { html += '<span class="cal-cell cal-blank"></span>'; }
  for (i = 1; i <= days; i++) {
    var cls = 'cal-cell';
    if (year === todayYear && month === todayMonth && i === todayDay) { cls += ' cal-today'; }
    html += '<span class="' + cls + '">' + String(i) + '</span>';
  }
  grid.innerHTML = html;
}
function calInit(root) {
  var now = new Date();
  var viewYear = now.getFullYear();
  var viewMonth = now.getMonth();
  var prev = root.querySelector('.cal-prev');
  var next = root.querySelector('.cal-next');
  function render() { calRender(root, viewYear, viewMonth); }
  if (prev) {
    prev.addEventListener('click', function () {
      viewMonth -= 1;
      if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
      render();
    });
  }
  if (next) {
    next.addEventListener('click', function () {
      viewMonth += 1;
      if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
      render();
    });
  }
  render();
}
function calInitAll() {
  var roots = document.querySelectorAll('.cal-wrap');
  for (var i = 0; i < roots.length; i++) { calInit(roots[i]); }
}
calInitAll();
</script>
</body>
</html>
