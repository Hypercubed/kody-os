<div class="st">
<p id="st-status">Loading the shell theme…</p>
<div id="st-panel" style="display:none">
<div class="st-field">
<h2 class="os-section-title">UI</h2>
<div class="st-row">
<span class="st-name">Background</span>
<p class="st-now"><span id="st-background-value">…</span> <span class="st-badge" id="st-background-badge">…</span></p>
<div class="st-segmented">
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<input type="hidden" name="background" value="desk">
<button type="submit" id="st-bg-desk">Desk</button>
</form>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<input type="hidden" name="background" value="paper">
<button type="submit" id="st-bg-paper">Paper</button>
</form>
</div>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<input type="hidden" name="field" value="background">
<button type="submit" class="st-quiet">Reset</button>
</form>
</div>
<p id="st-background-note" class="st-note" style="display:none">Custom grid, set via file or agent. Choose desk or paper below to replace it.</p>
<div class="st-row">
<span class="st-name">Name</span>
<p class="st-now"><span id="st-name-value">…</span> <span class="st-badge" id="st-name-badge">…</span></p>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<label>Name <input type="text" name="name" id="st-name-input" value="" maxlength="200"></label>
<button type="submit">Save</button>
</form>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<input type="hidden" name="field" value="name">
<button type="submit" class="st-quiet">Reset</button>
</form>
</div>
<div class="st-row">
<span class="st-name">Icon</span>
<p class="st-now"><span id="st-icon-value">…</span> <span class="st-badge" id="st-icon-badge">…</span></p>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<label>Glyph <input type="text" name="icon" id="st-icon-input" value=""></label>
<button type="submit">Save</button>
</form>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<input type="hidden" name="field" value="icon">
<button type="submit" class="st-quiet">Reset</button>
</form>
</div>
<p id="st-icon-note" class="st-note" style="display:none">Custom mark, set via file or agent. Type a glyph below, or use the stock mark, to replace it.</p>
</div>
<div class="st-field">
<h2 class="os-section-title">Pages</h2>
<div class="st-row">
<span class="st-name">Help</span>
<p class="st-now"><span id="st-showHelp-value">…</span> <span class="st-badge" id="st-showHelp-badge">…</span></p>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<input type="hidden" name="showHelp" id="st-showHelp-want" value="0">
<button type="submit" class="edit-toggle-btn" id="st-showHelp-toggle" role="switch" aria-checked="false" aria-label="Hide Help"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg></button>
</form>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<input type="hidden" name="field" value="showHelp">
<button type="submit" class="st-quiet">Reset</button>
</form>
</div>
<div class="st-row">
<span class="st-name">About</span>
<p class="st-now"><span id="st-showAbout-value">…</span> <span class="st-badge" id="st-showAbout-badge">…</span></p>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="set">
<input type="hidden" name="showAbout" id="st-showAbout-want" value="0">
<button type="submit" class="edit-toggle-btn" id="st-showAbout-toggle" role="switch" aria-checked="false" aria-label="Hide About"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg></button>
</form>
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<input type="hidden" name="field" value="showAbout">
<button type="submit" class="st-quiet">Reset</button>
</form>
</div>
</div>
<div class="st-reset-all">
<form method="get" action="../theme/settings">
<input type="hidden" name="action" value="reset">
<button type="submit">Reset all</button>
</form>
</div>
</div>
<style>
.st-field { margin: 0 0 28px 0; width: 720px; max-width: 100%; }
.st-field p { margin: 0 0 12px 0; }
.st-segmented { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 12px 0; }
.st-segmented form { margin: 0; }
.st-badge { display: inline-block; padding: 2px 10px; border: 1px solid #000; font-size: 14px; font-weight: bold; }
.st-badge-changed { background: #000; color: #fff; }
button.st-quiet { border: 0; box-shadow: none; padding: 0; min-height: 48px; text-decoration: underline; font-weight: normal; font-size: 16px; }
.st-note { font-size: 16px; }
#st-status { font-size: 18px; }
.st-field .os-section-title { margin-bottom: 12px; }
.st-name { font-weight: bold; width: 110px; flex-shrink: 0; }
.st-row .st-now { width: 200px; flex-shrink: 0; }
.st-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 12px 0; border: 2px solid #000; padding: 12px; }
.st-field > .st-row:last-child { margin-bottom: 0; }
.st-row p { margin: 0; }
.st-row > form { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0; }
.st-row > form:not(:last-child) { flex: 1 1 auto; }
.st-row > form:last-child { margin-left: auto; }
.st-row > .st-segmented { flex: 1 1 auto; margin: 0; }
.st-row label { display: inline-flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
.st-row input[type="text"] { flex: 1 1 auto; min-width: 0; }
.st-reset-all { margin-top: 24px; }
/* Edit-page toggles: .bundle button (0,1,1) outranks the shell's
   .edit-toggle-btn (0,1,0), so the toggle look is re-asserted here
   with higher specificity: off is an elevated white plate, on is
   flat and inverted, exactly like Apps Edit. */
.st button.edit-toggle-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 3rem; min-height: 3rem; padding: 0; border: var(--rule); background: var(--paper); color: #000; box-shadow: var(--lift); }
.st button.edit-toggle-btn svg { width: 1.25rem; height: 1.25rem; stroke: currentColor; }
.st button.edit-toggle-btn:hover { background: var(--shade); }
.st button.edit-toggle-btn-on { background: #000; color: #fff; box-shadow: none; transform: translate(3px, 3px); }
.st button.edit-toggle-btn-on:hover { background: #000; color: #fff; }
</style>
<script>
/* Settings panel. Stateless: no theme in app state, no act() calls.
 * Reads the shell theme through GET /theme/<id> (cookie session),
 * renders each field's effective value with a default/changed badge, and
 * submits changes as plain GET forms. With JavaScript, submits go through
 * fetch with format=json and re-render in place; without it, the
 * form round-trips with a 303 back to this panel. Pure functions are
 * defined first so Node tests can load this script without a DOM and
 * call them directly; DOM wiring is guarded by typeof document. */
function stAppIdFromBase(base) {
  var parts = String(base).split('/');
  for (var i = 0; i < parts.length; i++) {
    if (parts[i] === 'apps' && i + 1 < parts.length) return parts[i + 1];
  }
  return '';
}
function stThemeBase(base) {
  var id = stAppIdFromBase(base);
  if (id === '') return '';
  return String(base).replace('/apps/' + id, '/theme/' + id);
}
function stIsGrid(value) {
  return typeof value === 'object' && value !== null && Array.isArray(value.grid);
}
function stIsSvg(value) {
  return typeof value === 'string' && value.indexOf('<svg') === 0;
}
function stBadgeState(field, override) {
  if (override && override[field] !== undefined) return 'changed';
  return 'default';
}
function stDisplayValue(field, effective) {
  if (field === 'background') {
    if (stIsGrid(effective.background)) return 'custom grid';
    return effective.background;
  }
  if (field === 'icon') {
    if (stIsSvg(effective.icon)) return 'custom mark';
    if (effective.icon === '') return 'stock mark';
    return effective.icon;
  }
  if (field === 'showHelp' || field === 'showAbout') {
    return effective[field] === false ? 'hidden' : 'shown';
  }
  return effective[field];
}
function stFormQuery(form) {
  var params = new URLSearchParams();
  var els = form.elements || [];
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.name) params.append(el.name, el.value);
  }
  params.set('format', 'json');
  if (typeof window !== 'undefined' && window.location) params.set('from', window.location.pathname);
  return params.toString();
}
if (typeof document !== 'undefined') {
  var stRoot = document.querySelector('.st');
  var stBase = '';
  var stNode = stRoot;
  while (stNode) {
    if (stNode.getAttribute) {
      var stFound = stNode.getAttribute('data-action-base');
      if (stFound) { stBase = stFound; break; }
    }
    stNode = stNode.parentNode;
  }
  if (stBase === '' && typeof window !== 'undefined' && window.location) stBase = window.location.pathname;
  var stTheme = stThemeBase(stBase);
  var stStatus = document.getElementById('st-status');
  var stPanel = document.getElementById('st-panel');
  function stSetStatus(text) { if (stStatus) stStatus.textContent = text; }
  function stSetBadge(field, theme) {
    var badge = document.getElementById('st-' + field + '-badge');
    if (!badge) return;
    var state = stBadgeState(field, theme.override);
    badge.textContent = state;
    badge.className = state === 'changed' ? 'st-badge st-badge-changed' : 'st-badge';
  }
  function stMenuLink(pageId) {
    var links = document.querySelectorAll ? document.querySelectorAll('a') : [];
    for (var i = 0; i < links.length; i++) {
      var href = links[i].getAttribute('href') || '';
      if (href.indexOf('/apps/') !== -1) continue;
      if (href === '/' + pageId || href.substr(-(pageId.length + 1)) === '/' + pageId) return links[i];
    }
    return null;
  }
  function stRenderPageRow(theme, field, label) {
    var hidden = theme.effective[field] === false;
    var toggle = document.getElementById('st-' + field + '-toggle');
    if (toggle) {
      if (hidden) {
        toggle.className = 'edit-toggle-btn edit-toggle-btn-on';
      } else {
        toggle.className = 'edit-toggle-btn';
      }
      toggle.setAttribute('aria-checked', hidden ? 'true' : 'false');
      toggle.setAttribute('aria-label', (hidden ? 'Show ' : 'Hide ') + label);
    }
    var want = document.getElementById('st-' + field + '-want');
    if (want) want.value = hidden ? '1' : '0';
    var menuLink = stMenuLink(label.toLowerCase());
    if (menuLink) menuLink.style.display = hidden ? 'none' : '';
  }
  function stBrand() {
    if (typeof document.querySelector !== 'function') return null;
    return document.querySelector('.os-brand');
  }
  /* Repaint the server-rendered shell chrome from the effective theme so a
   * save is visible with no refresh: document title, menu-bar brand name and
   * mark, and the body background. Mirrors resolveTheme in src/app.ts: desk
   * is the bare CSS default (no inline style), paper is 'background: #fff'.
   * A grid background has no panel control and is left for a refresh. */
  function stApplyChrome(theme) {
    var eff = (theme && theme.effective) || {};
    var name = typeof eff.name === 'string' && eff.name !== '' ? eff.name : 'kody-os';
    var title = typeof eff.title === 'string' && eff.title !== '' ? eff.title : name;
    if (typeof document.title === 'string') {
      var sep = ' \u00b7 ';
      var parts = document.title.split(sep);
      parts[parts.length - 1] = title;
      document.title = parts.join(sep);
    }
    var brand = stBrand();
    if (brand && brand.childNodes) {
      var kids = brand.childNodes;
      for (var i = kids.length - 1; i >= 0; i--) {
        if (kids[i] && kids[i].nodeType === 3) brand.removeChild(kids[i]);
      }
      if (typeof document.createTextNode === 'function') brand.appendChild(document.createTextNode(name));
      var old = null;
      var els = brand.childNodes;
      for (var j = 0; j < els.length; j++) {
        if (els[j] && els[j].nodeType === 1) { old = els[j]; break; }
      }
      var icon = eff.icon;
      if (typeof icon === 'string' && icon !== '' && typeof document.createElement === 'function') {
        var span = document.createElement('span');
        span.setAttribute('class', 'os-mark-glyph');
        span.setAttribute('aria-hidden', 'true');
        if (stIsSvg(icon)) span.innerHTML = icon;
        else span.textContent = icon;
        if (old && typeof brand.replaceChild === 'function') brand.replaceChild(span, old);
        else if (typeof brand.insertBefore === 'function') brand.insertBefore(span, brand.firstChild || null);
      } else if (icon === '') {
        var src = '';
        if (old && old.tagName === 'IMG' && typeof old.getAttribute === 'function') src = old.getAttribute('src') || '';
        if (src === '' && typeof document.querySelector === 'function') {
          var link = document.querySelector('link[rel="icon"]');
          if (link && typeof link.getAttribute === 'function') src = link.getAttribute('href') || '';
        }
        if (src !== '' && typeof document.createElement === 'function') {
          var img = document.createElement('img');
          img.setAttribute('class', 'os-mark-img');
          img.setAttribute('src', src);
          img.setAttribute('alt', '');
          img.setAttribute('aria-hidden', 'true');
          if (old && typeof brand.replaceChild === 'function') brand.replaceChild(img, old);
        }
      }
    }
    if (document.body) {
      if (eff.background === 'desk') document.body.removeAttribute('style');
      else if (eff.background === 'paper') document.body.setAttribute('style', 'background: #fff');
    }
  }
  function stRender(theme) {
    var fields = ['background', 'name', 'icon', 'showHelp', 'showAbout'];
    for (var i = 0; i < fields.length; i++) {
      var field = fields[i];
      var valueEl = document.getElementById('st-' + field + '-value');
      if (valueEl) valueEl.textContent = stDisplayValue(field, theme.effective);
      stSetBadge(field, theme);
    }
    var bgNote = document.getElementById('st-background-note');
    if (bgNote) bgNote.style.display = stIsGrid(theme.effective.background) ? '' : 'none';
    var iconNote = document.getElementById('st-icon-note');
    if (iconNote) iconNote.style.display = stIsSvg(theme.effective.icon) ? '' : 'none';
    var deskBtn = document.getElementById('st-bg-desk');
    if (deskBtn) deskBtn.className = theme.effective.background === 'desk' ? 'os-btn--dark' : '';
    var paperBtn = document.getElementById('st-bg-paper');
    if (paperBtn) paperBtn.className = theme.effective.background === 'paper' ? 'os-btn--dark' : '';
    var nameInput = document.getElementById('st-name-input');
    if (nameInput) nameInput.value = theme.effective.name;
    var iconInput = document.getElementById('st-icon-input');
    if (iconInput) iconInput.value = (theme.override.icon !== undefined && !stIsSvg(theme.override.icon)) ? theme.override.icon : '';
    stRenderPageRow(theme, 'showHelp', 'Help');
    stRenderPageRow(theme, 'showAbout', 'About');
    stApplyChrome(theme);
    if (stPanel) stPanel.style.display = '';
  }
  function stLoad() {
    if (stTheme === '') { stSetStatus('Could not find this app on the page.'); return; }
    fetch(stTheme + '?format=json', { credentials: 'same-origin' }).then(function (resp) {
      return resp.json();
    }).then(function (theme) {
      if (!theme || theme.ok !== true) { stSetStatus('Could not read the shell theme.'); return; }
      stRender(theme);
      stSetStatus('');
    }).catch(function () {
      stSetStatus('Could not read the shell theme.');
    });
  }
  var stForms = document.querySelectorAll ? document.querySelectorAll('.st form') : [];
  for (var f = 0; f < stForms.length; f++) {
    (function (form) {
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var action = form.getAttribute('action') || stTheme;
        var url = action + (action.indexOf('?') === -1 ? '?' : '&') + stFormQuery(form);
        fetch(url, { credentials: 'same-origin' }).then(function (resp) {
          return resp.json();
        }).then(function (result) {
          if (!result || result.ok !== true) {
            stSetStatus(result && result.error ? result.error : 'That change was not saved.');
            return;
          }
          stSetStatus('Saved.');
          stLoad();
        }).catch(function () {
          form.submit();
        });
      });
    })(stForms[f]);
  }
  if (stTheme !== '') {
    for (var g = 0; g < stForms.length; g++) { stForms[g].setAttribute('action', stTheme); }
  }
  stLoad();
}
</script>
