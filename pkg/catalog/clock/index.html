<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
.clock-wrap { text-align: center; padding: 32px 16px; }
.clock-time { font-size: 48px; line-height: 1.1; margin: 0 0 8px 0; font-variant-numeric: tabular-nums; }
.clock-date { font-size: 18px; margin: 0; }
/* Clock: vertically center body content in the app panel and Home widget (moved from the shell theme — app styles live in the app). */
.widget[aria-label="Clock"] {
	display: flex;
	flex-direction: column;
}
.widget[aria-label="Clock"] .app-body,
.app[aria-label="Clock"] .app-body {
	flex: 1;
	display: flex;
	flex-direction: column;
	justify-content: center;
	min-height: 8rem;
}
</style>
</head>
<body>
<div class="clock-wrap">
<p class="clock-time">--:--</p>
<p class="clock-date">Loading date</p>
</div>
<script>
function padNum(n) { return (n < 10 ? '0' : '') + String(n); }
function tickClock(root) {
  var now = new Date();
  var h = now.getHours();
  var m = now.getMinutes();
  var suffix = h >= 12 ? 'PM' : 'AM';
  var h12 = h % 12;
  if (h12 === 0) { h12 = 12; }
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var t = root.querySelector('.clock-time');
  var d = root.querySelector('.clock-date');
  if (t) { t.textContent = String(h12) + ':' + padNum(m) + ' ' + suffix; }
  if (d) { d.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + String(now.getDate()); }
}
function initClock() {
  var roots = document.querySelectorAll('.clock-wrap');
  for (var i = 0; i < roots.length; i++) { tickClock(roots[i]); }
}
initClock();
setInterval(function () {
  var roots = document.querySelectorAll('.clock-wrap');
  for (var i = 0; i < roots.length; i++) { tickClock(roots[i]); }
}, 60000);
</script>
</body>
</html>
